<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dead Grid</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="game" aria-label="Dead Grid zombie survival game"></canvas>

    <div class="hud hud-top">
      <div class="brand">
        <span class="brand-mark"></span>
        <div>
          <strong>Dead Grid</strong>
          <span id="runStatus">Zone 1</span>
        </div>
      </div>
      <div class="stat-row">
        <div class="meter danger"><span id="healthBar"></span><b id="healthText"></b></div>
        <div class="meter stamina"><span id="staminaBar"></span><b id="staminaText"></b></div>
        <div class="meter armor"><span id="armorBar"></span><b id="armorText"></b></div>
      </div>
      <div class="inventory">
        <span id="weaponText">Pistol</span>
        <span id="ammoText">0 / 0</span>
        <span id="scrapText">0 scrap</span>
      </div>
    </div>

    <aside class="panel" id="upgradePanel">
      <header>
        <div>
          <span>Field Base</span>
          <strong>Tech Tree</strong>
        </div>
        <button id="panelToggle" type="button" aria-label="Close upgrades">X</button>
      </header>
      <div class="base-stats">
        <span id="levelText">Level 1</span>
        <span id="distanceText">Range 0m</span>
      </div>
      <div class="upgrade-list" id="upgradeList"></div>
    </aside>

    <div class="toast" id="toast"></div>

    <div class="menu-screen" id="mainMenu">
      <div class="menu-card">
        <span>Dead Grid</span>
        <strong>Zombie Survival</strong>
        <div class="menu-actions">
          <button id="newGameButton" type="button">Start New Game</button>
          <button id="loadGameButton" type="button">Load Game</button>
        </div>
      </div>
    </div>

    <div class="menu-screen" id="pauseMenu" hidden>
      <div class="menu-card compact">
        <span>Paused</span>
        <strong>Field Menu</strong>
        <div class="menu-actions">
          <button id="resumeButton" type="button">Resume</button>
          <button id="saveGameButton" type="button">Save Game</button>
          <button id="pauseLoadButton" type="button">Load Game</button>
          <button id="pauseNewButton" type="button">Start New Game</button>
          <button id="quitGameButton" type="button">Quit Game</button>
        </div>
      </div>
    </div>

    <div class="death-screen" id="deathScreen" hidden>
      <div>
        <span>Signal lost</span>
        <strong>Survivor down</strong>
        <button id="restartButton" type="button">Return to base</button>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
